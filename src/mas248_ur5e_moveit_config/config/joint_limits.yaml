# URDF provides the robot's original hard position and velocity limits.
# This file only adds deliberately conservative acceleration limits for coursework.
joint_limits:
  shoulder_pan_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  shoulder_lift_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  elbow_joint: {has_acceleration_limits: true, max_acceleration: 1.0}
  wrist_1_joint: {has_acceleration_limits: true, max_acceleration: 1.5}
  wrist_2_joint: {has_acceleration_limits: true, max_acceleration: 1.5}
  wrist_3_joint: {has_acceleration_limits: true, max_acceleration: 1.5}
